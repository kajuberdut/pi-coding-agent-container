services:
  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: local/pi-coding-agent:latest
    container_name: pi_coding_agent
    
    tty: true
    stdin_open: true

    # Keep container alive in the background when started via docker compose up.
    # manage.sh run will override this entrypoint to execute the pi CLI.
    entrypoint: ["/entrypoint.sh"]

    environment:
      - HOME=/home/node
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Git Identity Configuration (pulled from .env)
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-}

    volumes:
      - ./workspace:/workspace
      - ./.pi-data:/home/node/.pi
      - tmux-shared:/shared
      
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true

    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node/.config:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.npm:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid

    pids_limit: 150

    networks:
      - internal_network


    restart: unless-stopped
    depends_on:
      local-model-runner:
        condition: service_healthy
    profiles:
      - agent
      - all

  local-model-runner:
    image: ${MODEL_RUNNER_IMAGE}
    container_name: llama_cpp_server
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    
    ports:
      - "127.0.0.1:${MODEL_PORT:-8080}:8080"

    volumes:
      - ./models:/models

    command: >
      --model /models/${MODEL_FILE:-Qwen3.6-27B-MTP-GGUF-UD-Q4_K_XL.gguf}
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers ${GPU_LAYERS:-99}
      --ctx-size ${CTX_SIZE:-32768}
      ${LLAMA_ARGS:-}



    networks:
      - internal_network
      - external_network
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    profiles:
      - runner
      - all

  agent-web-portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    image: local/agent-web-portal:latest
    container_name: agent_web_portal
    
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    
    ports:
      - "127.0.0.1:7681:7681" # ttyd defaults to 7681 internally
      
    # SECURITY NOTE: Do NOT mount the host's Docker socket (/var/run/docker.sock) here.
    # Docker socket access is root-equivalent on the host. The portal is decoupled
    # and communicates with the agent solely via a tmux Unix socket on the shared volume.
    volumes:
      - tmux-shared:/shared
      
    # Spawns ttyd and attaches to the tmux session inside the pi-agent container via the shared volume
    environment:
      - PORTAL_PASSWORD=${PORTAL_PASSWORD:-}
    command: |
      sh -c "if [ -z \"$$PORTAL_PASSWORD\" ]; then
        echo 'Error: PORTAL_PASSWORD is not set in .env' >&2
        exit 1
      fi
      exec ttyd -W -c pi:\"$$PORTAL_PASSWORD\" -p 7681 sh -c 'while ! tmux -S /shared/tmux.sock has-session -t pi 2>/dev/null; do
        echo \"Waiting for Pi session to start...\"
        sleep 1
      done
      exec tmux -S /shared/tmux.sock attach -t pi'"
    
    tmpfs:
      - /tmp:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=1777,noexec,nodev,nosuid

    depends_on:
      - pi-agent
      
    networks:
      - external_network
    restart: unless-stopped
    profiles:
      - portal
      - all

  model-proxy:
    image: ${MODEL_PROXY_IMAGE}
    container_name: model_proxy
    # Forward port 8080 from internal network to the host's external model port (via MODEL_PROXY_HOST)
    command: tcp-listen:8080,fork,reuseaddr tcp:${MODEL_PROXY_HOST:-host.docker.internal}:${EXTERNAL_MODEL_PORT:-8080}
    networks:
      internal_network:
        aliases:
          - local-model-runner
      external_network:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - proxy


networks:
  internal_network:
    driver: bridge
    internal: true

  external_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  tmux-shared: