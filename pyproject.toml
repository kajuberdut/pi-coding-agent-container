[project]
name = "pib"
version = "2.0.0"
description = "Pi Coding Agent container management CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
pib = "pib.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
